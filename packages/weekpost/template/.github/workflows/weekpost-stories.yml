name: weekpost-stories

# Every hour: opens one GitHub issue (label `story`) for each Story that is due to be posted by hand in the next hour, and
# closes the issue of a Story you have recorded as published or canceled. weekpost does not post Stories: the issue tells you
# the time, the link for the sticker and the commands. It can also be run by hand. Runs code from main only; the database
# secrets exist only in the reminder step. It uses the same secrets as weekpost-metrics, and no others.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

# One run at a time, never cancelled midway.
concurrency:
  group: weekpost-stories
  cancel-in-progress: false

permissions: {}

jobs:
  stories:
    # Main only: a manual dispatch from another branch would run that branch's code with the database secrets.
    # Also restrict the environment's deployment branches to main (defense in depth).
    if: github.ref == 'refs/heads/main'
    environment: weekpost
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: remind the Stories to post by hand
        env:
          WEEKPOST_SUPABASE_URL: ${{ secrets.WEEKPOST_SUPABASE_URL }}
          WEEKPOST_SUPABASE_KEY: ${{ secrets.WEEKPOST_SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx weekpost stories --remind --issue
