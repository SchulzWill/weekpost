name: weekpost-preview

# Media preview. Runs when a pull request that changes content gets the `media-ok` label (and again on every
# push while the label stays): generates the media of the changed weeks, keeps it as the `weekpost-preview`
# artifact and comments the cost and the way to open it. This is the only workflow that calls the paid
# OpenRouter API. The label must match `ci.previewLabel` in weekpost.config.ts.
on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
    paths:
      - 'content/**'

# One preview per pull request at a time; never cancelled midway so the cost record of a run is not lost.
concurrency:
  group: weekpost-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  generate:
    # Only with the label (on the labeled event, only when it is that label) and never from a fork: a fork
    # gets no secrets, and this job runs the pull request's code with the OpenRouter key.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'media-ok') &&
      (github.event.action != 'labeled' || github.event.label.name == 'media-ok')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      any: ${{ steps.weeks.outputs.any }}
      generation: ${{ steps.gen.outcome }}
    env:
      TZ: UTC
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      SCRATCH: /tmp/weekpost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # The file list comes from the API, not from the pull request's code.
      - name: changed weeks
        id: weeks
        run: |
          mkdir -p "$SCRATCH"
          gh pr diff "$PR" --name-only > "$SCRATCH/paths.txt"
          npx weekpost weeks "$SCRATCH/paths.txt" "$SCRATCH/weeks.txt"
          echo "any=$([ -s "$SCRATCH/weeks.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: check content
        if: steps.weeks.outputs.any == 'true'
        run: npx weekpost check

      # Images, voice-over and the cost record of earlier runs of THIS pull request (a pull request's cache is only
      # visible to itself and to the default branch, and the preview never runs there): never pay twice. The weekly
      # cap therefore holds per pull request, not across pull requests.
      - name: media cache
        if: steps.weeks.outputs.any == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: weekpost-out-pr${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            weekpost-out-pr${{ github.event.pull_request.number }}-
            weekpost-out-

      - name: chromium
        if: steps.weeks.outputs.any == 'true'
        run: npx playwright install --with-deps chromium

      # A broken post does not hide the preview of the others: the job fails at the end.
      - name: generate
        id: gen
        if: steps.weeks.outputs.any == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          status=0
          while read -r week; do
            npx weekpost generate "$week" || status=1
          done < "$SCRATCH/weeks.txt"
          exit $status

      - name: pack the preview
        if: steps.weeks.outputs.any == 'true'
        run: npx weekpost ci pack "$SCRATCH/weeks.txt" "$SCRATCH/artifact"

      - name: write the comment
        if: steps.weeks.outputs.any == 'true'
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GENERATION: ${{ steps.gen.outcome }}
        run: |
          flag=""
          [ "$GENERATION" = "failure" ] && flag="--generation-failed"
          npx weekpost ci comment preview "$SCRATCH/artifact" "$SCRATCH/weeks.txt" --pr="$PR" --sha="$SHA" --run-url="$RUN_URL" $flag --out="$SCRATCH/comment.md"

      - name: keep the preview
        if: steps.weeks.outputs.any == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekpost-preview
          path: /tmp/weekpost/artifact/
          retention-days: 30
          if-no-files-found: error

      - name: keep the comment
        if: steps.weeks.outputs.any == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekpost-preview-comment
          path: /tmp/weekpost/comment.md
          retention-days: 1

      - name: fail if generation had errors
        if: steps.gen.outcome == 'failure'
        run: exit 1

  # Writes to the pull request without a checkout: the token that can write never sits next to the code of the pull request.
  comment:
    needs: generate
    if: ${{ !cancelled() && needs.generate.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weekpost-preview-comment
          path: ${{ runner.temp }}/comment

      - name: comment
        run: gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none --body-file "$RUNNER_TEMP/comment/comment.md"

  # Optional: a hosted copy of the preview on Cloudflare Pages, for reviewing from a phone. Needs the repository
  # variable WEEKPOST_PREVIEW_PAGES=true and the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Put
  # Cloudflare Access in front of the project: the preview contains unpublished posts. Without a checkout, so the
  # token never meets the pull request's code; only static files are published.
  pages:
    needs: [generate, comment]
    if: ${{ !cancelled() && vars.WEEKPOST_PREVIEW_PAGES == 'true' && needs.generate.outputs.any == 'true' && needs.comment.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PROJECT: ${{ vars.WEEKPOST_PAGES_PROJECT || format('{0}-weekpost-preview', github.event.repository.name) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weekpost-preview
          path: ${{ runner.temp }}/site

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weekpost-preview-comment
          path: ${{ runner.temp }}/comment

      - name: static files only
        run: rm -rf "$RUNNER_TEMP/site/_worker.js" "$RUNNER_TEMP/site/functions" "$RUNNER_TEMP/site/_routes.json"

      # The project is created on the first run; later runs fail here because it exists, which is fine.
      - name: create the Pages project
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.28.0"
          command: pages project create ${{ env.PROJECT }} --production-branch=main

      - name: publish
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.28.0"
          command: pages deploy ${{ runner.temp }}/site --project-name=${{ env.PROJECT }} --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true

      - name: add the link to the comment
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: |
          { cat "$RUNNER_TEMP/comment/comment.md"; printf '\n\nHosted preview: %s\n' "$URL"; } > "$RUNNER_TEMP/with-link.md"
          gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none --body-file "$RUNNER_TEMP/with-link.md"
