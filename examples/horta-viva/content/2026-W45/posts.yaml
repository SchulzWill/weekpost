  - id: 2026-11-08-reel-weekly-recap
    date: 2026-11-08
    type: reel
    accounts: [en]
    times: { en: "18:00" }
    pillar: other
    reel:
      segments:
        - text: { en: "Weekly recap: the garden in eight steps." }
          image_prompt: "Wide shot of a sunny urban terrace garden with raised beds, photo style"
          seconds: 8
        - text: { en: "Monday: we sowed basil and parsley." }
          image_prompt: "Hands sowing seeds into a small tray of soil, photo style"
          seconds: 8
        - text: { en: "Tuesday: the mint got its own pot." }
          image_prompt: "A pot of mint next to a row of herbs on a windowsill, photo style"
          seconds: 8
        - text: { en: "Wednesday: morning watering at the base." }
          image_prompt: "Watering can pouring at the base of a tomato plant, photo style"
          seconds: 7
        - text: { en: "Thursday: mulch went around the tomatoes." }
          image_prompt: "Straw mulch around young tomato plants in a raised bed, photo style"
          seconds: 7
        - text: { en: "Friday: first lettuce leaves to harvest." }
          image_prompt: "Fresh lettuce leaves in a wooden crate, photo style"
          seconds: 7
        - text: { en: "Saturday: the seed swap filled a table." }
          image_prompt: "People exchanging paper seed envelopes at a market table, photo style"
          seconds: 7
        - text: { en: "Next week: bring a jar and a friend." }
          image_prompt: "Empty glass jars lined up on a wooden bench in soft light, photo style"
          seconds: 8
      narration: { en: "This week at the garden, in eight quick steps. We sowed basil and parsley on Monday. On Tuesday the mint got a pot of its own, so its roots stop crowding the other herbs. On Wednesday we watered in the morning, at the base of the plants. On Thursday we spread straw mulch around the tomatoes to keep the soil moist. By Friday the first lettuce leaves were ready to harvest. On Saturday the seed swap filled a whole table with paper envelopes. Next week, bring a jar and a friend, and we will do it again." }
    caption: { en: "The week in the garden, from sowing to the seed swap." }
